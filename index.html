<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>247211-Lab 1</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>About me</h1>
    </header>

    <nav>
      <a href="#one">One</a>
      <a href="#two">Two</a>
      <a href="#three">Three</a>
    </nav>

    <section id="one">
      <h2>Who</h2>
      <!-- Lab 1 -->

      <figure>
        <img src="images/image.jpeg" alt="My photo" width="200" />
        <figcaption>My photo</figcaption>
      </figure>

      <ul>
        <li>First</li>
        <li>Second</li>
      </ul>

      <!-- Task 15 extras -->
      <p>
        <strong>student</strong> &copy; 247211
      </p>

      <blockquote>Air University Kharian Campus.</blockquote>

      <svg width="80" height="80" aria-label="Blue circle" role="img">
        <circle cx="40" cy="40" r="40" fill="#4a90d9"></circle>
      </svg>
    </section>

    <section id="two">
      <h2>Form</h2>

      <form>
        <fieldset>
          <legend>Your details</legend>

          <div>
            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Your name"
              required
            />
          </div>

          <div>
            <label for="pw">Password</label>
            <input type="password" id="pw" name="password" />
          </div>

          <div>
            <label for="em">Email</label>
            <input type="email" id="em" name="email" />
          </div>

          <div>
            <label>
              <input type="checkbox" name="agree" value="yes" /> I agree
            </label>
          </div>

          <p>Campus</p>

          <div>
            <label>
              <input type="radio" name="campus" value="kharian" /> Kharian
            </label>
          </div>

          <div>
            <label>
              <input type="radio" name="campus" value="islamabad" /> Islamabad
            </label>
          </div>

          <div>
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="3"></textarea>
          </div>

          <div>
            <label for="day">Day</label>
            <select id="day" name="day">
              <option value="mon">Monday</option>
              <option value="tue">Tuesday</option>
              <option value="wed">Wednesday</option>
            </select>
          </div>

          <div>
            <label for="city">City</label>
            <input type="text" id="city" name="city" list="cities" />
            <datalist id="cities">
              <option value="Kharian"></option>
              <option value="Gujrat"></option>
            </datalist>
          </div>

          <div>
            <label for="dob">Date</label>
            <input type="date" id="dob" name="dob" />
          </div>

          <div>
            <label for="n">Number</label>
            <input type="number" id="n" name="seats" min="1" max="40" />
          </div>

          <div>
            <label for="col">Colour</label>
            <input type="color" id="col" name="col" value="#1a2744" />
          </div>

          <div>
            <label for="vol">Range</label>
            <input type="range" id="vol" name="vol" min="0" max="10" />
          </div>

          <div>
            <label for="cv">File</label>
            <input type="file" id="cv" name="cv" />
          </div>

          <div class="buttons">
            <button type="submit">Send</button>
            <button type="reset">Clear</button>
          </div>
        </fieldset>
      </form>
    </section>

    <section id="three">
      <h2>Shapes</h2>

      <div class="shapes-wrap">
        <div class="circle"></div>
        <div class="square"></div>
      </div>
    </section>

    <footer id="contact">Roll 247211</footer>
  </body>
</html>
